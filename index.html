<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8e8dc" />
    <meta name="description" content="走进 3D 工作室，探索 AI 建模在视频、游戏、3D 打印和建筑中的应用。" />
    <title>Open Studio — AI 建模作品集</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  </head>
  <body>
    <main id="portfolio" aria-label="3D 工作室作品集">
      <div class="world" id="world">
        <img class="scene-poster" id="scene-poster" src="%BASE_URL%scene-preview.png" alt="工作室模型预览" />
        <canvas id="studio-canvas" tabindex="0" aria-label="3D 工作室场景。拖动改变视角，滚轮缩放，按 R 或 Home 恢复全景，点击模型查看作品。"></canvas>
        <div class="scene-work-labels" id="scene-work-labels" aria-label="场景中的作品入口" hidden></div>
        <div class="work-tooltip" id="work-tooltip" aria-hidden="true">
          <span class="tooltip-number" id="work-tooltip-number">01</span>
          <span class="tooltip-copy"><strong id="work-tooltip-title">作品名称</strong><small>点击查看作品</small></span>
          <span class="tooltip-enter" aria-hidden="true">↵</span>
        </div>
        <div class="world-wash" aria-hidden="true"></div>

        <header class="masthead">
          <a class="brand" href="%BASE_URL%" aria-label="Open Studio，返回场景全景">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="brand-copy"><strong>OPEN STUDIO</strong><small>AI MODELING · 01—05</small></span>
          </a>
          <div class="masthead-tools">
            <p class="interaction-hint"><span class="hint-dot" aria-hidden="true"></span>小幅拖动 <b>·</b> 点击标签</p>
            <button class="icon-button reset-button" id="reset-view" type="button" aria-label="恢复工作室初始视角" title="恢复初始视角">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.4 10a7.8 7.8 0 1 1-.2 3.4M4.4 10V4.9M4.4 10h5.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </header>

        <div class="scene-label" aria-hidden="true"><span>STUDIO VIEW</span><span class="scene-label-line"></span><span>晴日 · 自然光</span></div>

        <section class="work-rail" aria-label="桌面作品目录">
          <div class="rail-heading"><span>AI 建模应用方向</span><span id="rail-counter">05 个入口</span></div>
          <div class="rail-items" id="work-list"></div>
        </section>

        <p class="scene-status" id="scene-status" role="status" aria-live="polite">正在准备工作室场景…</p>

        <div class="load-card" id="loading" role="status" aria-live="polite">
          <span class="load-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="load-copy"><strong id="loading-title">正在打开工作室</strong><span id="loading-detail">整理桌面作品与自然光</span></span>
          <span class="load-percent" id="loading-percent">0%</span>
          <span class="load-track" aria-hidden="true"><i id="loading-bar"></i></span>
        </div>

        <dialog class="work-dialog" id="work-dialog" aria-labelledby="work-title">
          <div class="dialog-shell">
            <div class="dialog-topline">
              <span id="work-number">作品 01 / 05</span>
              <button class="icon-button close-button" id="close-work" type="button" aria-label="关闭作品介绍">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              </button>
            </div>
            <div class="project-tabs" id="project-tabs" role="group" aria-label="项目内容"></div>
            <div class="detail-content" id="project-panel" role="region" aria-label="项目详情">
              <section class="detail-media-column" aria-label="项目媒体">
                <div class="media-stage" id="media-stage" role="region" aria-live="polite"></div>
                <div class="media-gallery" id="media-gallery" role="group" aria-label="项目图片与媒体"></div>
              </section>
              <article class="detail-copy">
                <p class="eyebrow" id="work-category">AI 建模项目</p>
                <div class="detail-title-row"><h1 id="work-title">作品名称</h1><span class="dialog-index" id="work-index">01</span></div>
                <p class="detail-intro" id="work-description"></p>
                <section class="process-section" aria-labelledby="process-heading">
                  <h2 id="process-heading">从模型到应用</h2>
                  <div class="process-list" id="work-stages"></div>
                </section>
                <div class="work-tags" id="work-tags" aria-label="项目关键词"></div>
                <p class="work-note" id="work-note"></p>
                <div class="work-actions" id="work-actions"></div>
              </article>
            </div>
            <div class="dialog-bottom">
              <span class="detail-hint" id="detail-hint">滚动查看项目内容</span>
              <div class="dialog-nav">
                <button id="previous-work" type="button" aria-label="查看上一件作品">←</button>
                <button id="next-work" type="button" aria-label="查看下一件作品">→</button>
              </div>
            </div>
          </div>
        </dialog>

        <dialog class="resume-lightbox" id="resume-lightbox" aria-labelledby="resume-lightbox-title">
          <div class="resume-lightbox-shell">
            <div class="resume-lightbox-topline">
              <div>
                <h2 id="resume-lightbox-title">简历放大预览</h2>
                <span class="resume-lightbox-help">按 Esc 或点击关闭</span>
              </div>
              <button class="icon-button close-button" id="close-resume-lightbox" type="button" aria-label="关闭简历放大预览">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              </button>
            </div>
            <div class="resume-lightbox-content">
              <img class="resume-lightbox-image" id="resume-lightbox-image" alt="" />
            </div>
          </div>
        </dialog>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
