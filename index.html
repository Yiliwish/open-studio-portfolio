<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8e8dc" />
    <meta name="description" content="一间置于草地与天空之间的 3D 工作室，点击场景中的模型浏览作品。" />
    <title>Open Studio — 3D 作品集</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main id="portfolio" aria-label="3D 工作室作品集">
      <div class="world" id="world">
        <img class="scene-poster" id="scene-poster" src="/scene-preview.png" alt="工作室模型预览" />
        <canvas id="studio-canvas" tabindex="0" aria-label="3D 工作室场景。拖动旋转，滚轮缩放，按方向键旋转视角。点击桌面模型查看作品。"></canvas>
        <div class="world-wash" aria-hidden="true"></div>

        <header class="masthead">
          <a class="brand" href="/" aria-label="Open Studio，返回场景全景">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="brand-copy"><strong>OPEN STUDIO</strong><small>3D WORKS · 01—05</small></span>
          </a>
          <div class="masthead-tools">
            <p class="interaction-hint"><span class="hint-dot" aria-hidden="true"></span>拖动旋转 <b>·</b> 点击桌面模型</p>
            <button class="icon-button reset-button" id="reset-view" type="button" aria-label="恢复工作室初始视角" title="恢复初始视角">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.4 10a7.8 7.8 0 1 1-.2 3.4M4.4 10V4.9M4.4 10h5.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </header>

        <div class="scene-label" aria-hidden="true"><span>STUDIO VIEW</span><span class="scene-label-line"></span><span>晴日 · 自然光</span></div>

        <section class="work-rail" aria-label="桌面作品目录">
          <div class="rail-heading"><span>桌面作品</span><span id="rail-counter">05 件模型</span></div>
          <div class="rail-items" id="work-list"></div>
        </section>

        <p class="scene-status" id="scene-status" role="status" aria-live="polite">正在准备工作室场景…</p>

        <div class="load-card" id="loading" role="status" aria-live="polite">
          <span class="load-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="load-copy"><strong id="loading-title">正在打开工作室</strong><span id="loading-detail">整理桌面作品与自然光</span></span>
          <span class="load-percent" id="loading-percent">0%</span>
          <span class="load-track" aria-hidden="true"><i id="loading-bar"></i></span>
        </div>

        <dialog class="work-dialog" id="work-dialog" aria-labelledby="work-title">
          <div class="dialog-topline"><span id="work-number">作品 01 / 05</span><button class="icon-button close-button" id="close-work" type="button" aria-label="关闭作品介绍"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div>
          <div class="dialog-main"><div><p class="eyebrow" id="work-category">模型作品</p><h1 id="work-title">作品名称</h1></div><span class="dialog-index" id="work-index">01</span></div>
          <p class="dialog-note" id="work-description">点击场景中的其他模型，继续浏览桌面作品。</p>
          <div class="dialog-bottom"><span class="model-tag"><span class="model-tag-dot"></span>BLENDER MODEL</span><div class="dialog-nav"><button id="previous-work" type="button" aria-label="查看上一件作品">←</button><button id="next-work" type="button" aria-label="查看下一件作品">→</button></div></div>
        </dialog>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
